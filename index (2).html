<html lang="en">
<head>

<title>Happy Birthday</title>
<style>

:root[data-theme="dark"]{--bg:#1d1219;--card:#2a1a24;--text:#fbe9f0;--muted:#c9a0b3;--accent:#ff6b9d;--accent2:#7a2a49;--line:#4a2d3d;--soft:#3a2230;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:28px 22px;text-align:center;position:relative}

.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-size:30px;font-weight:700;color:var(--accent);line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}

.reason{margin-top:12px;min-height:56px;background:var(--soft);border-radius:14px;padding:14px;font-size:16px}

.tl b{display:block}.tl span{color:var(--muted);font-size:13px}
.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;margin:8px 0}
.meter label{flex:0 0 130px;font-size:14px}
.meter .bar{flex:1;margin:0}
.msg{white-space:pre-line;background:var(--soft);border-radius:14px;padding:16px;font-size:15px}
dialog{border:0;border-radius:18px;padding:20px;background:var(--card);color:var(--text);max-width:92vw;width:380px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
dialog input,dialog textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
[hidden]{display:none!important}
.hero{overflow:hidden}
.bgm{position:absolute;inset:0;z-index:0}
.bgm img,.bgm video{width:100%;height:100%;object-fit:cover;display:block}
.hero.has::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.6));z-index:1}
.hero .emoji,.hero h1,.hero p{position:relative;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.hero.has{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.tools{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:6px}
.tools .gear{position:static}
.nav{display:flex;gap:8px;margin:14px 0 0}
.tab{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gal{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:12px}

.gi i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:1px 6px;font-size:12px;font-style:normal}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.empty{color:var(--muted);padding:18px 0}
.tl .acts{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tl .acts button{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.tl .acts button.v{background:var(--accent);color:#fff}
#pk .gal{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));max-height:50vh;overflow:auto}
#pk .gi.sel{outline:3px solid var(--accent)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.lb .med img,.lb .med video{max-width:100%;max-height:68vh;border-radius:10px;display:block}
.lb input{margin-top:12px;width:min(420px,100%);padding:9px;border-radius:10px;border:0;text-align:center;background:#fff;color:#222;font:inherit}
.lb .row{display:flex;gap:8px;margin-top:12px}
.lb button{border:0;border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer}

.chk{cursor:default}
.bgm .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
@media (prefers-reduced-motion:reduce){.bgm .sl{transition:none}}
#cel{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
#cel div{font-size:clamp(26px,8vw,60px);font-weight:800;color:#fff;text-align:center;padding:18px 28px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pop 4.5s ease both}

</style>
</head>

}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(function(p){p.px=p.x;p.py=p.y;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx+(p.sway!=null?Math.sin(p.life/18+p.sway):0);p.y+=p.vy;p.r+=p.vr||0;p.life--;
    cx.globalAlpha=Math.max(0,Math.min(1,p.life/30));
    if(p.t==="c"){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);cx.restore()}
    else if(p.t==="s"){cx.strokeStyle=p.c;cx.lineWidth=p.s;cx.lineCap="round";cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke()}
    else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.font=p.s+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(p.ch,0,0);cx.restore()}});
  cx.globalAlpha=1;
  ps=ps.filter(function(p){return p.life>0&&p.y<innerHeight+100&&(p.t!=="e"||p.y>-100)});
  if(ps.length||Date.now()<endAt)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
$("btnParty").onclick=party;
async function load(){try{var r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;var t=await r.text();if(t!==last){var j=JSON.parse(t);last=t;D=j;render()}}catch(e){if(!D){D=JSON.parse($("fb").textContent);render()}}}
load();setInterval(load,30000);document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script>
